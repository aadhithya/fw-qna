# The retrieval eval: questions a user might ask, and the pages that answer them.
#
# For each question, `expected` lists every page that would be a good answer: the guide, the spec, a book chapter
# or an example, whichever cover the topic. A question counts as found when any one of them is among the top k
# results. `keywords` are the exact names an agent would pass to search_docs (the question is searched with
# them, as the chat does).
#
# The pages were chosen from the titles and headings of the docs, not from what the search returns. The eval
# is a measurement, not a target: do not change the questions or the pipeline to make the numbers better.
# Run it with `make eval`. Edit freely: a wrong expectation is a bug in this file.

version: v0.1.0

questions:
  - id: define-agent
    question: How do I define an agent?
    expected:
      - docs/agents.md
      - docs/specs/agents.md
      - docs/getting-started.md
      - docs/book/01-your-first-agent/02-a-typed-agent.md

  - id: run-agent-result
    question: How do I run an agent and read its result?
    expected:
      - docs/agents.md
      - docs/getting-started.md
      - docs/book/01-your-first-agent/03-running-it.md

  - id: check-output
    question: How do I reject an answer that the output schema cannot catch?
    keywords: [check_output]
    expected:
      - docs/agents.md
      - docs/getting-started.md
      - docs/book/01-your-first-agent/05-failures-and-check-output.md

