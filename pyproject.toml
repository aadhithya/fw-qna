[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fw_qna = ["defaults.yaml"]

[project]
name = "fw-qna"
version = "1.0.0"
description = "A terminal RAG chat for the featherweight documentation, built on featherweight."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "bm25s",
    "featherweight[anthropic]>=0.1.0",
    "httpx",
    "lancedb",
    "langchain-core",
    "llama-index-core",
    "prompt-toolkit",
    "pyyaml",
    "rich",
]

[project.scripts]
fw-qna = "fw_qna.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
